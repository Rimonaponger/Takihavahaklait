<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טאקי לימודי - עולם הצומח</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap');
        
        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)), 
                        url('https://images.unsplash.com/photo-1470058869958-2a77ade41c02?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #1a3a1a;
            user-select: none;
        }

        .card {
            width: 75px;
            height: 110px;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.3rem;
            border: 2px solid #e67e22;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            background-color: #ffedd5;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            z-index: 50;
        }

        .card.red { color: #e53e3e; border-color: #e53e3e; }
        .card.blue { color: #3182ce; border-color: #3182ce; }
        .card.green { color: #38a169; border-color: #38a169; }
        .card.yellow { color: #d69e2e; border-color: #d69e2e; }
        .card.any { color: #805ad5; border-color: #805ad5; }
        
        .card-back {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            border-color: #fff;
        }

        .card-inner {
            width: 85%;
            height: 85%;
            border: 1px dashed currentColor;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.7);
        }

        .pile-card {
            position: absolute;
            transform-origin: center;
        }

        .hand-container {
            position: fixed;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 15px;
            min-height: 140px;
            transition: all 0.3s ease;
        }

        .player1-hand { bottom: 10px; }
        .player2-hand { top: 10px; }

        .inactive-hand {
            filter: grayscale(0.3) opacity(0.5);
            pointer-events: none;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            color: #2d3748;
            padding: 30px;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 6px solid #fbbf24;
            text-align: center;
        }

        .answer-btn {
            width: 100%;
            text-align: right;
            padding: 14px;
            margin: 8px 0;
            border: 2px solid #fed7aa;
            border-radius: 12px;
            transition: all 0.2s;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
        }

        .answer-btn:hover {
            background: #fff7ed;
            border-color: #f97316;
            transform: scale(1.02);
        }

        .btn-main {
            background: #f97316;
            color: white;
            padding: 12px 32px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #c2410c;
        }

        .turn-tag {
            background: rgba(255,255,255,0.9);
            padding: 6px 24px;
            border-radius: 20px;
            font-size: 1.1rem;
            border: 2px solid #f97316;
            color: #f97316;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .active-tag {
            background: #f97316;
            color: white;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.6);
        }

        #color-picker {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 20px;
            z-index: 200;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .color-btn {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            cursor: pointer;
        }

        .emoji-feedback {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .info-panel {
            background: rgba(255,255,255,0.85);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid #f97316;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Quiz Overlay -->
    <div id="quiz-overlay" class="modal-overlay">
        <div class="quiz-container">
            <div id="quiz-emoji-container"></div>
            <div class="text-xs text-orange-600 font-bold mb-1 uppercase tracking-wider">שלב הלימוד - עולם הצומח</div>
            <div id="quiz-player-info" class="text-sm font-bold mb-2 text-gray-400"></div>
            <h2 id="quiz-question" class="text-xl font-bold mb-6 text-gray-800 leading-tight"></h2>
            <div id="quiz-options" class="flex flex-col"></div>
            <div id="quiz-feedback" class="mt-4 text-center font-bold hidden p-3 rounded-xl"></div>
        </div>
    </div>

    <!-- Win Overlay -->
    <div id="win-overlay" class="modal-overlay">
        <div class="bg-white p-10 rounded-3xl text-center shadow-2xl border-4 border-orange-500">
            <div class="text-6xl mb-4">🏆</div>
            <h1 id="win-title" class="text-5xl font-bold mb-6 text-orange-600">ניצחון!</h1>
            <button class="btn-main" onclick="location.reload()">משחק חדש</button>
        </div>
    </div>

    <div class="flex flex-col items-center justify-between h-full py-8 relative z-10">
        
        <!-- Top Player -->
        <div class="flex flex-col items-center">
            <div id="p2-tag" class="turn-tag mb-2">שחקן 2</div>
            <div id="p2-hand" class="hand-container player2-hand"></div>
        </div>

        <!-- Center Table -->
        <div class="flex flex-col items-center justify-center w-full">
            <div class="relative w-full max-w-lg h-48 flex justify-center items-center">
                <div id="deck" class="card card-back mr-12" onclick="handleAction('draw')">
                    <div class="text-white text-xs text-center font-bold">קופה<br><span class="text-[10px] opacity-90">שלב השאלה</span></div>
                </div>
                <div id="pile-container" class="relative"></div>
            </div>

            <div class="mt-8 flex flex-col items-center">
                <button id="end-taki-btn" class="btn-main hidden bg-orange-500 mb-4" onclick="closeTaki()">סגור טאקי</button>
                <div id="draw-count-display" class="bg-red-600 text-white px-4 py-1 rounded-full text-sm font-bold mb-2 hidden">2+ פעיל!</div>
                <div class="info-panel">
                    <div id="turn-indicator" class="text-lg font-bold text-orange-900">תור שחקן 1</div>
                </div>
            </div>
        </div>

        <!-- Bottom Player -->
        <div class="flex flex-col items-center">
            <div id="p1-hand" class="hand-container player1-hand"></div>
            <div id="p1-tag" class="turn-tag mt-2 active-tag">שחקן 1</div>
        </div>
    </div>

    <!-- Color Picker -->
    <div id="color-picker">
        <div class="color-btn bg-red-500" onclick="chooseColor('red')"></div>
        <div class="color-btn bg-blue-500" onclick="chooseColor('blue')"></div>
        <div class="color-btn bg-green-500" onclick="chooseColor('green')"></div>
        <div class="color-btn bg-yellow-400" onclick="chooseColor('yellow')"></div>
    </div>

    <script>
        const QUESTIONS = [
            { q: "מהו התפקיד העיקרי של השורש בצמח?", options: ["ייצור זרעים ופרחים", "קליטת מים ומינרלים מהקרקע ועיגון הצמח", "קליטת אור מהשמש", "הגנה מפני בעלי חיים"], correct: 1 },
            { q: "איזה סוג שורש צומח כשורש מרכזי אחד עבה הצולל לעומק האדמה?", options: ["שורש ציציתי", "שורש אוויר", "שורש שיפודי", "שורש מטפס"], correct: 2 },
            { q: "מה מאפיין שורשים ציציתיים?", options: ["שורש אחד ארוך מאוד", "קבוצת שורשים דקים המתפרסים קרוב לפני השטח", "שורשים הגדלים על ענפי העץ", "שורשים שאינם קולטים מים"], correct: 1 },
            { q: "מהו תפקידו המרכזי של הגזע בעצים?", options: ["רק לייצר פירות", "ייצוב הצמח והובלת מים וחומרי מזון בין השורשים לעלים", "הפיכת פחמן דו חמצני לחמצן", "קליטת מי גשמים מהאוויר"], correct: 1 },
            { q: "איך נקראים הצינורות בתוך הגבעול המעבירים מים מהשורש כלפי מעלה?", options: ["צינורות נשימה", "צינורות הובלה (עצה ושיפה)", "צינורות עיכול", "צינורות דם"], correct: 1 },
            { q: "איזה חלק בפרח אחראי על משיכת מאביקים בעזרת צבע וריח?", options: ["העלי", "עלי הכותרת", "האבקנים", "עלי הגביע"], correct: 1 },
            { q: "מהי 'האבקה'?", options: ["תהליך יצירת האוכל בעלים", "מעבר גרגרי אבקה מהאבקן לצלקת של העלי", "נפילת העלים בשלכת", "קליטת מים על ידי הפרח"], correct: 1 },
            { q: "מי מהבאים נחשב למאביק?", options: ["דבורה", "פרפר", "ציפור צופית", "כל התשובות נכונות"], correct: 3 },
            { q: "מהם שלושת המרכיבים העיקריים של הזרע?", options: ["קליפה, עובר וחומרי תשמורת", "מים, סוכר ואוויר", "שורש, גבעול ופרח זעיר", "אבקה, דבש וצבע"], correct: 0 },
            { q: "מהו תפקיד הפרי בטבע?", options: ["להיות טעים לבני אדם", "להגן על הזרעים ולסייע בהפצתם", "לייצר חמצן", "לקלוט שמש"], correct: 1 },
            { q: "איזו אדמה מאופיינת בגרגרים גדולים וניקוז מים מהיר מאוד?", options: ["אדמת חמר", "אדמה חולית", "אדמת כבול", "אדמת טרה רוסה"], correct: 1 },
            { q: "איזה חלק בצמח מבצע את תהליך הפוטוסינתזה (הטמעה)?", options: ["השורש", "העלה", "הזרע", "הקליפה"], correct: 1 }
        ];

        const COLORS = ['red', 'blue', 'green', 'yellow'];
        const SPECIALS = ['STOP', 'PLUS', '2PLUS', 'TAKI'];
        
        let deck = [];
        let pile = [];
        let playerHands = [[], []];
        let currentPlayer = 0;
        let isTakiMode = false;
        let pendingDraw = 0;
        let gameActive = true;
        let pendingAction = null; 

        const quizOverlay = document.getElementById('quiz-overlay');
        const quizQuestion = document.getElementById('quiz-question');
        const quizOptions = document.getElementById('quiz-options');
        const quizFeedback = document.getElementById('quiz-feedback');
        const quizPlayerInfo = document.getElementById('quiz-player-info');
        const quizEmojiContainer = document.getElementById('quiz-emoji-container');

        function initGame() {
            deck = createDeck();
            shuffle(deck);
            for(let i=0; i<8; i++) {
                playerHands[0].push(deck.pop());
                playerHands[1].push(deck.pop());
            }
            let firstCardIndex = deck.findIndex(c => !isNaN(c.value));
            pile.push(deck.splice(firstCardIndex, 1)[0]);
            render();
        }

        function createDeck() {
            let d = [];
            COLORS.forEach(color => {
                [1, 3, 4, 5, 6, 7, 8, 9].forEach(val => {
                    d.push({ color, value: val.toString(), type: 'number' });
                    d.push({ color, value: val.toString(), type: 'number' });
                });
                SPECIALS.forEach(spec => {
                    d.push({ color, value: spec, type: 'special' });
                    d.push({ color, value: spec, type: 'special' });
                });
            });
            for(let i=0; i<4; i++) d.push({ color: 'any', value: 'COLOR', type: 'special' });
            return d;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function handleAction(type, data) {
            if (!gameActive) return;
            if (type === 'play') {
                const card = playerHands[currentPlayer][data];
                const topCard = pile[pile.length - 1];
                let canPlay = false;
                if (isTakiMode) {
                    if (card.color === topCard.color) canPlay = true;
                } else if (pendingDraw > 0) {
                    if (card.value === '2PLUS') canPlay = true;
                } else {
                    if (card.color === 'any' || card.color === topCard.color || card.value === topCard.value) canPlay = true;
                }
                if (!canPlay) return;
            } else if (type === 'draw' && isTakiMode) return;

            pendingAction = { type, data };
            showQuiz();
        }

        function showQuiz() {
            const question = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
            quizPlayerInfo.textContent = `תור שחקן ${currentPlayer + 1}`;
            quizQuestion.textContent = question.q;
            quizOptions.innerHTML = '';
            quizFeedback.classList.add('hidden');
            quizEmojiContainer.innerHTML = ''; 
            
            question.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(idx, question.correct);
                quizOptions.appendChild(btn);
            });
            
            quizOverlay.style.display = 'flex';
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                // תשובה נכונה - פרחים רוקדים
                quizEmojiContainer.innerHTML = '<span class="emoji-feedback">🌸🌻🌸</span>';
                quizFeedback.textContent = "נכון מאוד! הפרח רוקד לכבודך!";
                quizFeedback.className = "mt-4 text-center font-bold text-green-700 bg-green-100 p-3 rounded-xl";
            } else {
                // תשובה שגויה - פרח נובל
                quizEmojiContainer.innerHTML = '<span class="emoji-feedback">🥀</span>';
                quizFeedback.textContent = "אופס, תשובה לא נכונה... אבל אפשר להמשיך לשחק!";
                quizFeedback.className = "mt-4 text-center font-bold text-red-700 bg-red-100 p-3 rounded-xl";
            }
            
            quizFeedback.classList.remove('hidden');
            
            // בכל מקרה ממשיכים לפעולה לאחר השהייה קצרה
            setTimeout(() => {
                quizOverlay.style.display = 'none';
                executePendingAction();
            }, 1500);
        }

        function executePendingAction() {
            if (!pendingAction) return;
            if (pendingAction.type === 'play') {
                const index = pendingAction.data;
                const card = playerHands[currentPlayer].splice(index, 1)[0];
                pile.push(card);
                handleCardLogic(card);
            } else if (pendingAction.type === 'draw') {
                drawCard();
            }
            pendingAction = null;
        }

        function handleCardLogic(card) {
            if (card.value === 'COLOR') {
                document.getElementById('color-picker').style.display = 'grid';
                return;
            }
            if (card.value === 'TAKI') {
                isTakiMode = true;
                document.getElementById('end-taki-btn').classList.remove('hidden');
                render();
                return;
            }
            if (isTakiMode) {
                render();
                return;
            }
            if (card.value === '2PLUS') pendingDraw += 2;
            if (card.value === 'STOP' || card.value === 'PLUS') {
                checkWin();
                if (gameActive) render();
                return;
            }
            checkWin();
            if (gameActive) endTurn();
        }

        function chooseColor(color) {
            pile[pile.length - 1].color = color;
            document.getElementById('color-picker').style.display = 'none';
            checkWin();
            if (gameActive) endTurn();
        }

        function closeTaki() {
            isTakiMode = false;
            document.getElementById('end-taki-btn').classList.add('hidden');
            const lastCard = pile[pile.length - 1];
            if (['2PLUS', 'STOP', 'COLOR', 'PLUS'].includes(lastCard.value)) {
                handleCardLogic(lastCard);
            } else {
                endTurn();
            }
        }

        function drawCard() {
            const count = pendingDraw > 0 ? pendingDraw : 1;
            for(let i=0; i<count; i++) {
                if (deck.length === 0) {
                    const top = pile.pop();
                    deck = [...pile];
                    shuffle(deck);
                    pile = [top];
                }
                playerHands[currentPlayer].push(deck.pop());
            }
            pendingDraw = 0;
            endTurn();
        }

        function endTurn() {
            currentPlayer = currentPlayer === 0 ? 1 : 0;
            render();
        }

        function checkWin() {
            if (playerHands[currentPlayer].length === 0) {
                gameActive = false;
                document.getElementById('win-title').textContent = `שחקן ${currentPlayer + 1} ניצח!`;
                document.getElementById('win-overlay').style.display = 'flex';
            }
        }

        function render() {
            const pileContainer = document.getElementById('pile-container');
            pileContainer.innerHTML = '';
            pile.slice(-5).forEach((card, i) => {
                const cardEl = createCardView(card);
                cardEl.classList.add('pile-card');
                cardEl.style.transform = `rotate(${(i - 2) * 5}deg) translate(${i * 2}px, ${i * 2}px)`;
                pileContainer.appendChild(cardEl);
            });

            renderHand(0, document.getElementById('p1-hand'));
            renderHand(1, document.getElementById('p2-hand'));

            const pNum = currentPlayer + 1;
            document.getElementById('turn-indicator').textContent = `תור שחקן ${pNum}`;
            document.getElementById('p1-tag').className = `turn-tag ${currentPlayer === 0 ? 'active-tag' : ''}`;
            document.getElementById('p2-tag').className = `turn-tag ${currentPlayer === 1 ? 'active-tag' : ''}`;
            
            if(pendingDraw > 0) document.getElementById('draw-count-display').classList.remove('hidden');
            else document.getElementById('draw-count-display').classList.add('hidden');
        }

        function renderHand(pIdx, container) {
            container.innerHTML = '';
            const isActive = (currentPlayer === pIdx);
            if (!isActive) container.classList.add('inactive-hand');
            else container.classList.remove('inactive-hand');

            playerHands[pIdx].forEach((card, i) => {
                const cardEl = createCardView(card);
                cardEl.style.marginRight = "-35px";
                if (isActive && gameActive) {
                    cardEl.onclick = () => handleAction('play', i);
                }
                container.appendChild(cardEl);
            });
        }

        function createCardView(card) {
            const div = document.createElement('div');
            div.className = `card ${card.color}`;
            
            const inner = document.createElement('div');
            inner.className = 'card-inner';
            let label = card.value;
            if(label === 'STOP') label = '🚫';
            if(label === 'COLOR') label = '🎨';
            if(label === 'TAKI') label = 'Taki';
            inner.textContent = label;
            div.appendChild(inner);
            return div;
        }

        window.onload = initGame;
    </script>
</body>
</html>
